name: Antigravity Orbit Multi-Surface CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Flutter 3.44.9 is the latest stable line supporting all target baselines:
  # Web (Wasm + dart2js fallback), Android 7.0 (API 24), iOS 13, Windows 10, macOS 11, Ubuntu 22.04.
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze-and-test:
    name: Analyze & Critical Path Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos
      - name: Run Critical Path Tests
        run: flutter test test/core/ test/features/ test/widget_test.dart

  build-web:
    name: Build Web (Wasm + dart2js fallback)
    needs: analyze-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Enable Web
        run: flutter config --enable-web
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web Release (Wasm + dart2js fallback)
        run: flutter build web --release --wasm
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-Web
          path: build/web/

  build-android:
    name: Build Android APK (API 24+)
    needs: analyze-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Release APK
        run: flutter build apk --release
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App (iOS 13+, unsigned)
    needs: analyze-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-iOS-App-Unsigned
          path: build/ios/iphoneos/Runner.app

  build-windows:
    name: Build Windows EXE (Windows 10+)
    needs: analyze-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows Release Executable
        run: flutter build windows --release
      - name: Upload Windows Bundle (EXE + DLLs)
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-Windows-Release
          path: build/windows/x64/runner/Release/

  build-macos:
    name: Build macOS App (macOS 11+)
    needs: analyze-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS Release App
        run: flutter build macos --release
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-macOS-Release
          path: build/macos/Build/Products/Release/

  build-linux:
    name: Build Linux Bundle (Ubuntu 22.04+)
    needs: analyze-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux Desktop Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux Release Bundle
        run: flutter build linux --release
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-Linux-Release
          path: build/linux/x64/release/bundle/
